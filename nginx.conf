server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entrypoint so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # History fallback for the React Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
